<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🦌 루돌프 그림그래프 구조대</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf6f0;color:#194b39;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1040px;margin:auto;padding:18px}.card{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 8px 28px #204d3218}h1{font-size:clamp(22px,4vw,34px)}h2{margin:5px 0 12px}button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#e3f0e7;color:#17573c;font-weight:800;cursor:pointer}button.primary{background:#167c56;color:white}button.selected{outline:3px solid #f1a93a;background:#fff3d9}button:disabled{opacity:.4;cursor:not-allowed}input{border:2px solid #cbded0;border-radius:10px;padding:12px;width:100%;max-width:340px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.muted{color:#6c8173}.board{background:#f4faf6;border:2px solid #d5e9da;border-radius:17px;padding:16px;margin:15px 0}.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #cbded0}.row b{min-width:75px}.symbols{display:flex;flex-wrap:wrap;gap:3px;align-items:center}.big{font-size:35px;line-height:1.1}.small{font-size:17px;line-height:1.1}.same{font-size:35px;line-height:1.1}.legend{text-align:center;margin:12px 0}.option{background:white;border:2px solid #d5e6da;text-align:left;width:100%;margin:5px 0}.option.selected{border-color:#167c56;background:#e3f7e8}.feedback{border-radius:12px;background:#fff1dc;padding:12px;margin:12px 0;font-weight:750}.ok{background:#dcf6e6}.table{border-collapse:collapse;width:100%;background:white}.table td,.table th{border:1px solid #cadfd0;padding:9px;text-align:center}.table th{background:#e4f2e9}.bigemoji{font-size:60px}.hide{display:none}.qr{width:180px;height:180px;background:white;padding:8px;border-radius:12px}.status{font-size:14px;color:#6b7e70}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.score{background:#edf7ef;border-radius:13px;padding:12px;font-weight:800}.foot{font-size:12px;color:#708578;text-align:center;margin:22px 0}
</style></head><body><main><h1>🦌 루돌프의 그림그래프 구조대!</h1><div class="status" id="connection">연결 준비 중…</div><div id="app"></div><div class="foot">초등 3학년 수학 · 모둠별 실시간 참여 · 선생님이 다음 문제를 넘겨요</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
// Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱 SDK 설정에서 값을 복사해 넣으세요.
window.GAME_FIREBASE_CONFIG = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PASTE_DATABASE_URL.firebasedatabase.app",
  projectId: "PASTE_PROJECT_ID",
  appId: "PASTE_APP_ID"
};

</script><script>
const $=x=>document.getElementById(x),q=new URLSearchParams(location.search);let db,auth,room='',role='',team='',state={},local={choice:-1,big:3,small:2},unsub=null,teacherKey='';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function info(s){$('connection').textContent=s}function error(s){$('app').innerHTML=`<div class="card"><h2>설정 확인이 필요해요</h2><p>${esc(s)}</p><p>Firebase 익명 로그인과 Realtime Database 설정을 확인해 주세요.</p></div>`}
function setup(){
info('Firebase 연결 설정 필요');
$('app').innerHTML='<div class="card"><h2>게임 파일 준비 완료 🎄</h2><p>이 index.html 파일 하나를 웹호스팅에 올리면 됩니다. 교사·학생 기기의 실시간 연결에는 Firebase 설정이 필요해요.</p><ol><li>Firebase 프로젝트에서 웹 앱을 등록해요.</li><li>Authentication에서 익명 로그인을 켜고 Realtime Database를 만들어요.</li><li>이 파일을 메모장이나 코드 편집기로 열고 GAME_FIREBASE_CONFIG의 PASTE_… 값을 실제 설정값으로 바꿔요.</li><li>데이터베이스 접근 규칙을 설정하고 저장한 index.html을 업로드해요.</li></ol><p>설정 후 같은 주소에서 교사는 게임방을 만들고, 학생들은 생성된 학생 입장 링크로 참여해요. QR코드는 자동으로 만들지 않아요.</p><p><b>파일 이름만 바꾸거나 업로드하는 것만으로 기기 간 연결이 활성화되지는 않아요.</b></p></div>';
}
async function boot(){if(!window.GAME_FIREBASE_CONFIG||!GAME_FIREBASE_CONFIG.apiKey||GAME_FIREBASE_CONFIG.apiKey==='PASTE_API_KEY'){setup();return}try{firebase.initializeApp(GAME_FIREBASE_CONFIG);db=firebase.database();auth=firebase.auth();await auth.signInAnonymously();info('🟢 온라인 연결됨');const params=q;room=(params.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);role=params.get('role')==='teacher'?'teacher':room?'student':'home';if(role==='teacher'){teacherKey=sessionStorage.getItem('teacher_'+room)||'';if(!teacherKey){role='student';info('교사 인증 정보가 없습니다. 학생 입장 화면으로 이동합니다.')}}if(role==='home')home();else if(role==='student')join();else subscribe();}catch(e){error(e.message)}}
async function copyStudentLink(){
const link=location.origin+location.pathname+'?room='+room;
try{await navigator.clipboard.writeText(link);alert('주소 복사 완료')}catch(e){prompt('학생 접속 주소를 복사해 주세요.',link)}
}
function home(){$('app').innerHTML=`<div class="card"><h2>👩‍🏫 선생님 게임방 만들기</h2><p>선생님이 방을 만들면 학생들은 접속 링크로 입장할 수 있어요.</p><button class="primary" onclick="createRoom()">새 게임방 만들기</button></div><div class="card"><h2>🎒 학생 입장</h2><div class="flex"><input id="code" maxlength="6" placeholder="6자리 게임방 코드"><button onclick="location.href='?room='+encodeURIComponent($('code').value.trim().toUpperCase())">입장</button></div></div>`}
function random(n){let s='';const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<n;i++)s+=alphabet[Math.floor(Math.random()*alphabet.length)];return s}
async function createRoom(){let id=random(6),secret=random(18);try{await db.ref('rooms/'+id).set({stage:0,secret,created:firebase.database.ServerValue.TIMESTAMP,teams:{}});sessionStorage.setItem('teacher_'+id,secret);location.href='?room='+id+'&role=teacher'}catch(e){alert('방 만들기 실패: '+e.message)}}
function join(){let saved=sessionStorage.getItem('team_'+room)||'';if(saved){team=saved;subscribe();return}$('app').innerHTML=`<div class="card"><h2>🎒 ${esc(room)} 게임방 입장</h2><p>우리 모둠을 선택해 주세요. 한 모둠에서 한 기기로 참여해요.</p><div class="grid">${[1,2,3,4,5].map(i=>`<button class="option" onclick="enterTeam('${i}모둠')">🎁 ${i}모둠</button>`).join('')}</div></div>`}
async function enterTeam(t){team=t;try{let snap=await db.ref('rooms/'+room+'/stage').once('value');if(!snap.exists()){alert('게임방이 없어요. 코드를 확인해 주세요.');return}sessionStorage.setItem('team_'+room,t);subscribe()}catch(e){alert('입장 실패: '+e.message)}}
function subscribe(){if(unsub)unsub();let ref=db.ref('rooms/'+room);let fn=snap=>{if(!snap.exists()){error('게임방을 찾을 수 없어요.');return}let prev=state.stage;state=snap.val();if(prev!==state.stage)local={choice:-1,big:3,small:2};render()};ref.on('value',fn,e=>error(e.message));unsub=()=>ref.off('value',fn)}
function big(n,same=false){return Array.from({length:n},()=>`<span class="${same?'same':'big'}">🎁</span>`).join('')}function small(n,same=false){return Array.from({length:n},()=>`<span class="${same?'same':'small'}">🎁</span>`).join('')}
function graphRow(name,b,s,same=false){return `<div class="row"><b>${name}</b><div class="symbols">${big(b,same)}${small(s,same)}</div></div>`}function legend(same=false){return `<div class="legend"><span class="${same?'same':'big'}">🎁</span> = 10개　 <span class="${same?'same':'small'}">🎁</span> = 1개</div>`}
const titles=['그림이 엉뚱한 곳에!','편리한 단위를 골라 줘!','표와 그림그래프가 달라!','쌍둥이 그림을 찾아라!'];const leads=['항목에 어울리지 않는 그림이 있는 줄을 찾아보세요.','그림을 너무 많이 그리지 않으면서 정확히 나타내기에 좋은 단위를 골라보세요.','표를 보고 장갑의 그림 개수를 바르게 수정하세요.','큰 그림과 작은 그림의 크기가 같아 구별하기 어려워요. 잘못된 점을 찾아보세요.'];
function options(items){return items.map((s,i)=>`<button class="option ${local.choice===i?'selected':''}" onclick="choose(${i})">${s}</button>`).join('')}
function task(stage){if(stage===0)return `<div class="board"><h3>경로당에 보낼 겨울 선물</h3><p class="muted">선물 이름과 그림이 어울리는지 살펴보세요.</p>${[['목도리','🧣'],['장갑','🧤'],['담요','🧦']].map(([n,e],i)=>`<button class="option ${local.choice===i?'selected':''}" onclick="choose(${i})">${n}　<span style="font-size:30px">${e} ${e}</span>　🔍</button>`).join('')}</div>`;
if(stage===1)return `<div class="board"><h3>장난감 공장에서 만든 선물</h3><table class="table"><tr><th>종류</th><th>개수</th></tr><tr><td>자동차</td><td>230개</td></tr><tr><td>인형</td><td>180개</td></tr><tr><td>블록</td><td>310개</td></tr></table><p><b>어떤 단위가 편리할까요?</b></p>${options(['큰 그림 10개 / 작은 그림 1개','큰 그림 100개 / 작은 그림 10개','큰 그림 5개 / 작은 그림 1개','큰 그림 1000개 / 작은 그림 100개'])}</div>`;
if(stage===2)return `<div class="board"><h3>경로당에 보낼 겨울 선물</h3><table class="table"><tr><th>선물</th><th>개수</th></tr><tr><td>목도리</td><td>42개</td></tr><tr><td>장갑</td><td>22개</td></tr><tr><td>담요</td><td>9장</td></tr></table>${legend()}${graphRow('목도리',4,2)}${graphRow('장갑',local.big,2)}${graphRow('담요',0,9)}<p><b>장갑의 큰 그림 개수를 바꿔 보세요!</b></p><div class="flex"><button onclick="adjust(-1)">− 그림 지우기</button><b>${local.big}개</b><button onclick="adjust(1)">＋ 그림 추가</button></div></div>`;
if(stage===3)return `<div class="board"><h3>경로당에 보낼 겨울 선물</h3>${legend(true)}${graphRow('목도리',4,2,true)}${graphRow('장갑',2,2,true)}<p>큰 그림과 작은 그림이 같은 크기예요. 어떤 방법으로 고쳐야 할까요?</p>${options(['그림의 크기를 그대로 둔다','1개를 나타내는 그림을 더 작게 그린다','모든 그림을 더 크게 그린다'])}</div>`;return ''}
function choose(i){local.choice=i;render()}function adjust(n){local.big=Math.max(0,Math.min(6,local.big+n));render()}
function solved(stage){return [local.choice===2,local.choice===1,local.big===2,local.choice===1][stage]}
async function submit(){let st=state.stage;if(st>3||!team)return;let answer=st===2?local.big:local.choice;if(answer===-1){alert('먼저 답을 선택해 주세요!');return}let ok=solved(st);let ref=db.ref(`rooms/${room}/teams/${team}/answers/${st}`);try{let prev=(await ref.once('value')).val();if(prev){alert('이미 제출했어요. 선생님이 다음 문제를 열 때까지 기다려 주세요.');return}await ref.set({answer,correct:ok,at:firebase.database.ServerValue.TIMESTAMP});}catch(e){alert('제출 실패: '+e.message)}}
function render(){if(!state||state.stage===undefined)return;let st=state.stage,teacher=role==='teacher',submitted=state.teams?.[team]?.answers?.[st],link=location.origin+location.pathname+'?room='+room;
let html='';if(teacher){html+=`<div class="card"><h2>👩‍🏫 교사 진행실 · 방 코드 ${room}</h2><p>학생들에게 아래 접속 링크를 보내 주세요. 선생님이 <b>다음 문제</b>를 누르면 모든 기기가 동시에 이동해요.</p><div class="flex"><div><p><b>학생 입장 주소</b></p><p style="overflow-wrap:anywhere">${esc(link)}</p><button onclick="copyStudentLink()">주소 복사</button></div></div><div class="flex" style="margin-top:15px"><button onclick="move(-1)" ${st===0?'disabled':''}>← 이전 문제</button><button class="primary" onclick="move(1)" ${st>=4?'disabled':''}>${st===3?'결과 보기 🎉':'다음 문제 →'}</button><button onclick="resetGame()">처음부터 / 답안 초기화</button></div></div>`}
else html+=`<div class="card"><h2>🎒 ${esc(team)} · 방 코드 ${room}</h2><p>모둠 친구들과 함께 답을 정한 뒤 제출하세요. 다음 문제는 선생님이 열어 줘요.</p></div>`;
if(st<4){html+=`<div class="card"><div class="bigemoji">${['😢','😟','🙂','😄'][st]}🦌</div><p class="muted">미션 ${st+1} / 4</p><h2>${titles[st]}</h2><p>${leads[st]}</p>${teacher?`<p class="muted">교사 화면: 학생 제출 현황을 확인해 주세요.</p>`:submitted?`<div class="feedback ${submitted.correct?'ok':''}">${submitted.correct?'🎉 정답 제출 완료!':'📝 답안 제출 완료!'} 선생님이 다음 문제를 열 때까지 기다려요.</div>`:task(st)+`<button class="primary" onclick="submit()">답안 제출하기</button>`}</div>`}
else html+=`<div class="card" style="text-align:center"><div class="bigemoji">🦌🎁🥳</div><h2>루돌프가 활짝 웃어요!</h2><p>친구들 덕분에 그림그래프를 바르게 고쳤어. 고마워!</p></div>`;
html+=`<div class="card"><h2>🏆 모둠 점수판</h2><p class="muted">정답 한 문제당 10점 · 총 40점 · 속도 보너스 없음</p><div class="scores">${[1,2,3,4,5].map(i=>{let t=i+'모둠',ans=state.teams?.[t]?.answers||{},count=Object.values(ans).filter(x=>x?.correct).length;return `<div class="score">${t}<h2>⭐ ${count*10}점</h2>${teacher&&st<4?`<small>${ans[st]?'제출 완료 '+(ans[st].correct?'✓':'✗'):'제출 대기'}</small>`:''}</div>`}).join('')}</div></div>`;
$('app').innerHTML=html;}
async function move(d){if(role!=='teacher'||teacherKey!==state.secret)return alert('교사 권한이 없어요');let n=Math.max(0,Math.min(4,state.stage+d));try{await db.ref('rooms/'+room+'/stage').set(n)}catch(e){alert(e.message)}}
async function resetGame(){if(role!=='teacher'||teacherKey!==state.secret)return;if(!confirm('모든 모둠 답안과 점수를 지우고 1번 문제로 돌아갈까요?'))return;try{await db.ref('rooms/'+room).update({stage:0,teams:null})}catch(e){alert(e.message)}}
boot();
</script></body></html>
